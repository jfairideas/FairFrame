# FairFrame Supabase local config
# See https://supabase.com/docs/guides/cli/config

project_id = "eaficgjjvtekrqcxlaoy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "fairframe://auth/callback"
additional_redirect_urls = ["fairframe://auth/callback", "exp://127.0.0.1:8081/--/auth/callback"]

# Enable Google/Apple in Supabase Dashboard when OAuth client IDs are ready.
# CLI deploy fails if these are enabled without client_id / secret.
[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false

[functions.analyze-frame]
verify_jwt = true
